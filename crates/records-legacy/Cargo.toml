[package]
name = "krabka-records-legacy"
publish = false
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors = ["The Krabka Authors"]
description = "Kafka v0/v1 MessageSet (legacy) codec and v2 RecordBatch bridge"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-records-legacy"
readme = "../../README.md"
keywords = ["kafka", "wire-protocol", "messageset", "down-conversion"]
categories = ["encoding", "parser-implementations"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
assert2 = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
krabka-compression = { version = "0.6.0", default-features = false, features = [
    "gzip",
    "snappy",
    "lz4",
    "zstd",
] }
krabka-ids = { version = "0.6.0" }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-units = { workspace = true }

[dev-dependencies]
krabka-macros = { version = "1.0.5", path = "../macros" }
proptest = { workspace = true }
yare = { workspace = true }
