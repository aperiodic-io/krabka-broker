[package]
name = "krabka-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Derive macros that let one declaration in the broker stand for code it would otherwise repeat"
repository = "https://github.com/krabka-io/krabka-broker"
homepage = "https://github.com/krabka-io/krabka-broker"
documentation = "https://docs.rs/krabka-macros"
readme = "README.md"
keywords = ["krabka", "derive", "metrics", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]
# `krabka-log` derives with these macros, so they publish with it.
include = ["build.rs", "src/**/*.rs", "README.md", "CHANGELOG.md"]
[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
moxy = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
derive_more = { workspace = true }
futures-util = { workspace = true }
krabka-units = { workspace = true }
krabka-protocol = { version = "0.6.0", default-features = false }
prometheus-client = { workspace = true }
refined_type = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stateright = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
yare = { workspace = true }
