[package]
name = "krabka-restore"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Offline point-in-time restore: rebuilds a bootable krabka log directory from a KIP-405 tiered-storage archive"

[lints]
workspace = true

[lib]
name = "krabka_restore"
path = "src/lib.rs"

# `krabka-restore`, not `krabka-restore`. The `krabka` operator CLI resolves an
# unknown subcommand to `krabka-<name>` on `PATH`, the way git resolves
# `git foo` to `git-foo`. This exact spelling is what makes `krabka restore`
# work, so it deliberately breaks the `krabka-` convention the rest of the
# workspace follows.
[[bin]]
name = "krabka-restore"
path = "src/main.rs"

[dependencies]
bon = { workspace = true }
maplit = { workspace = true }
# The target cluster is formatted through the same code path `krabka format`
# uses, with the recovered topic and partition records seeded into the
# bootstrap stream.
krabka-format = { version = "1.0.3", path = "../format" }
krabka-ids = { version = "0.6.0" }
krabka-log = { version = "1.0.3", path = "../log" }
krabka-metadata = { version = "0.6.0" }
# The archive handle is built straight onto the object-store layer. The broker
# owns the same mapping, but a recovery tool must not carry the broker.
krabka-object-store = { version = "1.0.3", path = "../object-store", features = ["clap"] }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-raft = { version = "1.0.3", path = "../raft" }
# The KIP-405 archive key codec and segment metadata model.
krabka-remote-storage = { version = "1.0.3", path = "../remote-storage" }
# `Snapshot::load` reads a broker's `remote-log-metadata/snapshot` for
# `--rlmm-snapshot`, the authoritative-metadata cross-check against the
# bucket scan.
krabka-remote-storage-topic = { version = "1.0.3", path = "../remote-storage-topic" }
krabka-verified = { version = "1.0.3", path = "../verified" }
# `--cluster-id` accepts Kafka's base64 `Uuid` form, what `Metadata` and
# `DescribeCluster` report (#1042), as well as the hyphenated form.
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
derive_more = { workspace = true }
# The archive listing is consumed as a stream, so the scan never holds the
# whole bucket in memory.
futures-util = { workspace = true }
object_store = { workspace = true, features = ["aws", "gcp", "fs"] }
# RE2 semantics: `--exclude-key` and `--exclude-header` run over millions of
# archived records, so an operator-supplied pattern must stay linear in the
# input.
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `cli_main!` writes the binary's `main`.
krabka-macros = { version = "1.0.3", path = "../macros" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
yare = { workspace = true }
# `large_archive` implements `object_store::ObjectStore` to synthesise a
# listing far larger than any fixture could write to disk.
async-trait = { workspace = true }
# The producer-snapshot tests encode a sidecar by hand, independently of
# `krabka-log`'s writer.
crc32c = { workspace = true }
krabka-audit = { workspace = true }
# `dr_roundtrip` drives the operator's own backup tool: the capture it asserts
# on is the one an operator runs, not a re-implementation of it.
krabka-backup = { version = "1.0.3", path = "../backup-cli" }
krabka-broker = { version = "1.0.3", path = "../broker", features = ["test-helpers"] }
# `dr_roundtrip` reads a group's committed offsets back with `OffsetFetch`.
krabka-client-admin = { version = "0.6.0" }
krabka-client-core = { version = "0.6.0" }
krabka-security = { workspace = true }
# `diskless_capture_broker` sets the diskless flush cadence on a broker config.
krabka-units = { workspace = true }
ring = { workspace = true }
tempfile = { workspace = true }
