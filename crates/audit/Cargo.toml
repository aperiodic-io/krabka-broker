[package]
name = "krabka-audit"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Audit event model, OCSF serialization, and write pipeline for Krabka (FedRAMP 20x MLA)"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-audit"
keywords = ["kafka", "audit", "ocsf", "fedramp", "krabka"]
categories = ["development-tools::debugging"]

[lints]
workspace = true

[dependencies]
arc-swap.workspace = true
derive_more = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "rt", "time"] }
qubit-clock = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-ids = { version = "0.6.0" }
krabka-verified = { version = "1.0.2", path = "../verified" }
krabka-macros = { version = "1.0.2", path = "../macros" }
krabka-units = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
assert2 = { workspace = true }
krabka-log = { version = "1.0.2", path = "../log" }
mutants = { workspace = true }
stateright = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "krabka-audit"
path = "src/bin/audit.rs"
