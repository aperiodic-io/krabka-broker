[package]
name = "krabka-raft"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Metadata KRaft quorum (KIP-595 KraftController) for Krabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-raft"
readme = "README.md"
keywords = ["kafka", "raft", "kraft", "consensus", "krabka"]
categories = ["algorithms", "database-implementations"]

[lints]
workspace = true

[features]
# Promotes the deterministic KRaft consensus simulator into the library with
# trace recording, so `krabka-docgen` can run it in-process and render failure
# scenarios. Off by default — it carries no production code path. Re-exported
# from the leaf core crate as `krabka_raft::scenarios`.
scenarios = ["krabka-kraft-core/sim"]

[dependencies]
maplit = { workspace = true }
assert2 = { workspace = true }
krabka-kraft-core = { version = "1.0.2", path = "../kraft-core" }
krabka-ids = { version = "0.6.0" }
krabka-metadata = { version = "0.6.0" }
krabka-log = { version = "1.0.2", path = "../log" }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-verified = { version = "1.0.2", path = "../verified" }
krabka-macros = { version = "1.0.2", path = "../macros" }
krabka-client-core = { version = "0.6.0" }
krabka-units = { workspace = true }
refined_type = { workspace = true }
async-trait = { workspace = true }
wincode = { workspace = true }
serde-wincode = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
derive_more = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
krabka-security = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
mutants = { workspace = true }
stateright = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
