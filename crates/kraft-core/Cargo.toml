[package]
name = "krabka-kraft-core"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deterministic, sans-IO KRaft consensus core (KIP-595/996) for Krabka — wasm-friendly"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-kraft-core"
readme = "README.md"
keywords = ["kafka", "raft", "kraft", "consensus", "krabka"]
categories = ["algorithms", "simulation"]

[lints]
workspace = true

[features]
default = []
# The deterministic multi-node simulator with trace recording. Promotes the
# `sim` module (the scheduler the integration tests and `krabka-docgen` use, and
# the engine the in-browser WASM playground drives). Pure and IO-free; pulls in
# `serde` only to make recorded traces serializable.
sim = ["dep:serde"]

# A pure, deterministic, sans-IO leaf: no tokio, no filesystem, no sockets, no
# crypto. The async engine, real wire, and on-disk log live in `krabka-raft`,
# which re-exports this crate's modules under `krabka_raft::kraft`. Keeping the
# core a clean leaf is what lets it compile to `wasm32-unknown-unknown` for the
# browser playground.
[dependencies]
derive_more = { workspace = true }
bon = { workspace = true }
assert2 = { workspace = true }
krabka-voters = { version = "0.6.0" }
krabka-macros = { version = "1.0.4", path = "../macros" }
krabka-verified = { version = "1.0.4", path = "../verified" }
krabka-units = { workspace = true }
bytes = { workspace = true }
refined_type = { workspace = true }
uuid = { workspace = true, features = ["js"] }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
yare = { workspace = true }
