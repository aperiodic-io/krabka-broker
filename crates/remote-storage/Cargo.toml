[package]
name = "krabka-remote-storage"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "KIP-405 tiered-storage SPI (RemoteStorageManager / RemoteLogMetadataManager) and reference implementations for Krabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-remote-storage"
readme = "README.md"
keywords = ["kafka", "tiered-storage", "object-store", "krabka"]
categories = ["database-implementations", "filesystem"]

[lints]
workspace = true

[dependencies]
maplit = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# `krabka-worm-verify`, the standalone archive auditor, is a `[[bin]]` of this
# crate: the verifier and the manifest types it checks belong together.
clap = { workspace = true, features = ["derive"] }
krabka-audit = { workspace = true }
krabka-ids = { version = "0.6.0" }
krabka-macros = { version = "1.0.3", path = "../macros" }
krabka-object-store = { version = "1.0.3", path = "../object-store" }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-units = { workspace = true }
krabka-verified = { version = "1.0.3", path = "../verified" }
derive_more = { workspace = true }
# Streams the object listing, and the object bodies a deep verify re-hashes.
futures-util = { workspace = true }
hex = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wincode = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zerocopy = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
# `object_store::ObjectStore` is an `#[async_trait]` trait, so the versioned
# test double in `worm::verify` has to be written with the same attribute.
async-trait = { workspace = true }
# The lookup tests of `max.decompressed.message.bytes` write a compressed batch,
# and the library itself carries no codec.
krabka-compression = { version = "0.6.0", default-features = false, features = ["gzip"] }
krabka-log = { version = "1.0.3", path = "../log" }
krabka-protocol = { version = "0.6.0", default-features = false }
proptest = { workspace = true }
# `gcs_emulator` creates its buckets through the emulator's JSON control
# plane, which no `object_store` API reaches. Same pin as `krabka-object-store`,
# whose WORM bucket check is the other reqwest caller.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
# Generates a throwaway Ed25519 key pair for the WORM manifest signing tests.
# `krabka-audit` exposes no key generator, only `FileEd25519Signer`, which
# needs a PKCS#8 key that already exists.
ring = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[bin]]
name = "krabka-worm-verify"
path = "src/bin/worm-verify.rs"
