[package]
name = "krabka-barrier"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Administers krabka barrier groups: define a group, trigger a cut, list cuts, and verify a cut against the log"

[lints]
workspace = true

# A library as well as a binary, for the same reason `krabka-format` is one: a
# test that spawns the binary needs a Cargo working tree to build it from, and a
# Bazel test sandbox has none. Tests call `run_from_args` in process instead.
[lib]
name = "krabka_barrier"
path = "src/lib.rs"

[[bin]]
name = "krabka-barrier"
path = "src/main.rs"

[dependencies]
# `parse_barrier_marker` reads a marker back out of a fetched batch. The decoder
# lives with the injector so the two cannot drift.
krabka-broker = { version = "1.0.4", path = "../broker" }
krabka-client-core = { version = "0.6.0" }
krabka-protocol = { version = "0.6.0" }
krabka-units = { workspace = true }

clap = { workspace = true, features = ["env"] }
bytes = { workspace = true }
# `cli_main!` writes the binary's `main`.
krabka-macros = { version = "1.0.4", path = "../macros" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
krabka-client-admin = { version = "0.6.0" }
# BrokerConfig::for_tests lives behind the broker's own test-helpers feature
# now that the facade crate is gone.
krabka-broker = { version = "1.0.4", path = "../broker", features = ["test-helpers"] }
tempfile = { workspace = true }
