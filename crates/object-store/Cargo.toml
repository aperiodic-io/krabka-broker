[package]
name = "krabka-object-store"
# Internal plumbing (shared object-store construction); not part of the curated
# public crate surface — see the allowlist in tools/check-publish-allowlist.sh.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Unified object-store construction (typed config -> object_store handle) shared by Krabka's KIP-405 tiered storage and observability blockstore"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-object-store"
readme = "README.md"
keywords = ["kafka", "object-store", "s3", "gcs", "krabka"]
categories = ["database-implementations", "filesystem"]

[lints]
workspace = true

[features]
# Keep the legacy feature name for consumers of the `v013` module.
object-store-013 = []
# `ArchiveArgs`: the `--archive-*` flags `krabka backup` and `krabka restore`
# share, and their mapping onto an `ObjectStoreConfig`.
clap = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
# `tokio` carries the `WriteMultipart` upload that `ObjectStoreClient` streams
# a large segment through.
object_store = { workspace = true, features = ["tokio"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
krabka-macros = { version = "1.0.4", path = "../macros" }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }

# The S3, GCS and local-filesystem backends, and the signed bucket requests of
# the multipart listing and the WORM check. Their HTTP client and
# `LocalFileSystem` do not build for wasm32-wasip1, where only the in-memory
# backend is available and the other configurations are rejected.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
object_store = { workspace = true, features = ["aws", "gcp", "fs"] }
http = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }

[dev-dependencies]
assert2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util", "time"] }
mockall = { workspace = true }
