[package]
name = "krabka-format"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Formats a krabka broker log directory: Kafka's meta.properties, the bootstrap records, and the singleton VotersRecord"

[lints]
workspace = true

# `krabka format` in `krabka-cli`. That crate also drives the gres
# layer, so it could not follow the broker out; the command itself needs only the
# metadata and security crates, so it lives here and `krabka-cli` can depend on
# this library rather than carrying a second copy.
[lib]
name = "krabka_format"
path = "src/lib.rs"

[[bin]]
name = "krabka-format"
path = "src/main.rs"

[dependencies]
krabka-metadata = { version = "0.6.0" }
krabka-security = { workspace = true }
# The singleton VotersRecord this writes is the one the consensus engine reads
# back on the node's first boot.
krabka-raft = { version = "1.0.1", path = "../raft" }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
derive_more = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wincode = { workspace = true }
wincode = { workspace = true }
uuid = { workspace = true }
# `cli_main!` writes the binary's `main`.
krabka-macros = { version = "1.0.1", path = "../macros" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
thiserror = { workspace = true }
# `Date.toString` for the `meta.properties` date comment.
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
assert2 = { workspace = true }

[dev-dependencies]
krabka-ids = { version = "0.6.0" }
krabka-broker = { version = "1.0.1", path = "../broker" }
tempfile = { workspace = true }
