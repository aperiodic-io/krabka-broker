[package]
name = "krabka-remote-storage-topic"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Topic-backed RemoteLogMetadataManager for Krabka tiered storage"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-remote-storage-topic"
readme = "README.md"
keywords = ["kafka", "tiered-storage", "metadata", "krabka"]
categories = ["database-implementations", "encoding"]

[lints]
workspace = true

[dependencies]
bon = { workspace = true }
assert2 = { workspace = true }
maplit = { workspace = true }
krabka-remote-storage = { version = "1.0.5", path = "../remote-storage" }
krabka-client-admin = { version = "0.6.0" }
krabka-client-core = { version = "0.6.0" }
krabka-client-producer = { version = "0.6.0" }
krabka-protocol = { version = "0.6.0" }
krabka-ids = { version = "0.6.0" }
krabka-units = { workspace = true }
krabka-verified = { version = "1.0.5", path = "../verified" }
krabka-macros = { version = "1.0.5", path = "../macros" }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
refined_type = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "net", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
krabka-security = { version = "0.6.0" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
