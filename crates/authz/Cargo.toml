[package]
name = "krabka-authz"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared Kafka-ACL authorization evaluator for the Krabka broker and gateway"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-authz"
readme = "README.md"
keywords = ["kafka", "authorization", "acl", "security", "krabka"]
categories = ["authentication", "network-programming"]

[lints]
workspace = true

[dependencies]
bon = { workspace = true }
assert2 = { workspace = true }
krabka-metadata = { version = "0.6.0" }
krabka-security = { version = "0.6.0" }
krabka-verified = { version = "1.0.5", path = "../verified" }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
uuid = { workspace = true }
yare = { workspace = true }
