[package]
name = "krabka-log"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Byte-compatible reader/writer for Apache Kafka's on-disk log format"
repository = "https://github.com/krabka-io/krabka-broker"
homepage = "https://github.com/krabka-io/krabka-broker"
documentation = "https://docs.rs/krabka-log"
readme = "README.md"
keywords = ["kafka", "log", "storage", "records", "krabka"]
categories = ["database-implementations", "encoding"]
# The library and the design document its README links to. Tests, benches and
# fixtures stay out of the package.
include = ["src/**/*.rs", "docs/design.md", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[features]
default = []
# Exposes `Log::test_set_log_start_offset` (and other test-only mutators)
# to dependent crates' integration tests. Not enabled by default — the
# broker crate's `dev-dependencies` enables it for the replication
# tests.
test-helpers = []

[dependencies]
maplit = { workspace = true }
assert2 = { workspace = true }
krabka-ids = { version = "0.6.0" }
krabka-macros = { version = "1.0.3", path = "../macros" }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-compression = { version = "0.6.0", default-features = false }
krabka-verified = { version = "1.0.3", path = "../verified" }
krabka-units = { workspace = true }
bytes = { workspace = true }
crc32c = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zerocopy = { workspace = true }

# The positional segment read on wasm32-wasip1. std's `FileExt` for wasi is
# unstable, and rustix wraps `fd_pread` safely.
[target.'cfg(target_os = "wasi")'.dependencies]
rustix = { workspace = true }

# The `posix_fadvise(POSIX_FADV_WILLNEED)` readahead hint of the fetch path,
# and the `fallocate` block reservation of `preallocate`.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
bon = { workspace = true }
# The lookup and compaction tests of `max.decompressed.message.bytes` write
# compressed batches, and the library itself carries no codec.
krabka-compression = { version = "0.6.0", default-features = false, features = ["gzip"] }
mutants = { workspace = true }
proptest = { workspace = true }
# Exhaustive enumeration of the leader-epoch truncation core
# (`epoch_and_offset_for_entries`) in `leader_epoch_model.rs`.
stateright = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Drives `benches/log.rs`. `codspeed-criterion-compat` is criterion under
# another name: outside `cargo codspeed`, which nothing in this repository
# runs, it is criterion exactly. `ci.yml`'s `bench` job executes this suite
# beside `krabka-broker`'s six, nightly and on demand.
criterion = { version = "5.0.2", package = "codspeed-criterion-compat" }

[[bench]]
name = "log"
harness = false
