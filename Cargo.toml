[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_macros = "deny"
# These three opt-outs are intentional; re-evaluate once API surfaces
# stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
# Error type for the two tool binaries -- `krabka-docgen` and
# `krabka-bench-driver`. Library crates use `thiserror` enums, as the code
# style guide requires; a binary that only prints the error and exits does not
# need one.
anyhow = "1"
apache-avro = { version = "0.22", features = ["derive"] }
arc-swap = "1"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
crc32fast = "1"
dashmap = "6"
# Derive boilerplate for domain newtypes (Display/From/Into/Deref/AsRef/
# Constructor/FromStr and numeric ops) so wrappers over wire/domain primitives
# stay one-liners. See docs/style_guides/code_style_guide.md#newtypes-for-domain-values.
derive_more = { version = "2", features = ["debug", "display", "from", "into", "deref", "deref_mut", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
# KIP-714: `CLIENT_METRICS` `match` patterns are `java.util.regex.Pattern`s,
# lookaround and backreferences included, which the `regex` crate refuses.
fancy-regex = "0.19"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
# The local host name, which a controller bound to a wildcard address
# advertises, as Kafka resolves a wildcard listener host to
# `InetAddress.getLocalHost().getCanonicalHostName()`.
hostname = "0.4"
# KIP-664's ListTransactions filter accepts the full java.util.regex Pattern
# grammar (including lookaround and backreferences).
jsonpath-rust = "1.0"
# Linux kTLS: offload TLS record encryption to the kernel so `sendfile(2)`
# works THROUGH TLS (zero-copy fetch over encrypted connections). v6 tracks
# rustls ^0.23.12 + tokio-rustls ^0.26.0 (the workspace pins above). Safe
# wrapper — no raw `setsockopt` FFI — so it satisfies `unsafe_code = "forbid"`.
# Consumed Linux-only; gated under `[target.'cfg(target_os="linux")']` in the
# broker so non-Linux builds never pull it.
ktls = "6"
# Bounded decision cache for the OPA authorizer. `lru` provides
# an O(1) LRU with a non-zero capacity invariant; pair it with our own
# TTL field on the value (no built-in expiry).
lru = "0.18"
maplit = "1"
# mockall: generate test mocks for trait seams so engine-IO decision logic is
# unit-testable (and mutation-killable) without a live broker/quorum/database.
# Dev-dependency only — `#[cfg_attr(test, mockall::automock)]` keeps it out of
# shipped builds.
mockall = "0.15"
# Token, syntax-tree and template layer for the `krabka-macros` derives: one
# dependency in place of the `proc-macro2` / `syn` / `quote` trio.
moxy = { version = "0.5.3", features = ["macros", "template"] }
# mutants: `#[cfg_attr(test, mutants::skip)]` attribute for cargo-mutants. Used
# only where `exclude_re` cannot reliably suppress a mutant (struct-field-deletion
# mutants on a live-IO adapter). Dev-dependency only; expands to nothing.
mutants = "0.0.4"
num-traits = "0.2.19"
# `object_store` is the Apache-stewarded multi-backend object-store client used
# across the Rust data ecosystem (DataFusion, Polars, Delta-rs). Krabka's
# S3-compatible and native-GCS RemoteStorageManagers (KIP-405) are built on it.
# The version is pinned here and only the core is on: each member turns on the
# `aws`, `gcp` and `fs` backends it uses, and only for the targets that build
# them. Their HTTP client and `LocalFileSystem` do not build for
# wasm32-wasip1, where the broker keeps only the core.
object_store = { version = "0.14", default-features = false }
# OTLP distributed-tracing work stream. opentelemetry-otlp 0.33 lines up with
# the tonic 0.14 / prost 0.14 / reqwest 0.13 stack already in the dep graph.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
# Bridges `tracing` events → OTLP log records so services emit logs over OTLP
# (alloy:4317 → logs-distributor) rather than relying on container-stdout tailing
# (which doesn't stream on Docker Desktop). Version tracks the opentelemetry 0.33 stack.
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
# KIP-714 OTLP metrics: prost-generated OTLP MetricsData / MetricsService types
# (opentelemetry 0.33 stack). `gen-tonic-messages` + `trace` serve the traces
# signal. `gen-tonic` exposes the OTLP gRPC service traits and client, which
# pull tonic's transport; the broker adds it only on the native targets, because
# that transport does not build for wasm32-wasip1.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["kdf", "hmac"] }
prometheus-client = "0.25"
proptest = "1"
prost = "0.14"
# Thread-safe clock abstraction (rs-clock). Production code reads time through
# its three separate traits -- `WallClock` for business timestamps,
# `MonotonicClock` for elapsed-time arithmetic, and `Timer` for delays -- so
# tests drive time deterministically with `ManualMonotonicClock` and the
# `ManualWallClock`/`ManualTimer` it hands out, instead of `thread::sleep` or
# `tokio::time::sleep`. `StdWallClock`/`StdMonotonicClock`/`StdTimer` are the
# production implementations; none of them needs a Tokio runtime to construct,
# which is what keeps the config `Default` impls that build them callable from
# synchronous code.
qubit-clock = "~0.13.0"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
refined_type = "0.6"
# KIP-848: client-supplied `subscribed_topic_regex` matched against the
# metadata image. Uses RE2-compatible syntax (same regex engine family as
# the JVM's `java.util.regex` for the cases KIP-848 expects to portably
# support); diverges on lookahead/lookbehind which aren't in the KIP-848
# operator-readable subset.
regex = "1"
ring = "0.17"
# `process` is for `getrlimit` and `setrlimit`: the broker binary raises its
# open-file limit at start, as the JVM does for a Kafka broker.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# rustls-pemfile retired upstream (RUSTSEC-2025-0134, archived 2025-08).
# Use the PEM parsers in `rustls-pki-types` (same code; pull explicitly).
rustls-pki-types = { version = "1.15", features = ["alloc"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde-wincode = "=0.1.2"
serde_json = "1"
jsonschema = { version = "0.58", default-features = false }
sha2 = "0.11"
# Jepsen-style exhaustive concurrency-correctness model checking (KRaft
# consensus). Dev-dependency only — never linked into a shipped binary.
# Pinned: pre-1.0, minor bumps can be breaking.
stateright = "=0.31.0"
tempfile = "3"
testcontainers = "0.28"
# The latest crates.io release still requires testcontainers 0.27, whose
# bollard-stubs version conflicts with testcontainers 0.28. Pin the upstream
# compatibility update until the next testcontainers-modules release.
testcontainers-modules = { git = "https://github.com/testcontainers/testcontainers-rs-modules-community", rev = "d69e3a09397532accea9d9e907fecc280b1513a8", features = ["kafka"] }
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting"] }
tokio = { version = "1", default-features = false }
tokio-metrics = { version = "0.5", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-util = { version = "0.7", default-features = false }
toml = "1.1"
tonic = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-core = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }
uuid = { version = "1", features = ["v4", "serde"] }
# wincode + serde-wincode replace bincode for serde-derived wire shapes.
# Keep these paired so `SerdeCompat` implements this wincode's traits.
wincode = "=0.6"
zerocopy = { version = "0.8", features = ["derive"] }

# First-party crates inherited by more than one member.
krabka-audit = { path = "crates/audit", version = "1.0.3" }
krabka-security = "0.6.0"
krabka-units = "0.6.0"

